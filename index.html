<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Q4Practice1</title>
</head>
<body class="bg-light">
    <div class="container mt-5"></div>
    <h1 class="text-center text-primary mb-4">Electricity rate</h1>

    <div class="mb-3">
    <input type="text" id="kHw" class="form-control" placeholder="type here consumption of electricity">
    </div>

    <div class="d-grind mb-3">
    <button class="btn btn-info mt-2" onclick="checkConsumption()">Check</button>
    </div>

    



    <script>
        function checkConsumption(){
            var consumption = document.getElementById("kHw").value;

            if(isNaN(consumption) || consumption < 0){
                alert("Please put a valid number");

            }
      
      
      
            else if (consumption <=100){
            alert("Lifeline Consumer ; Discouted rates");

        }
        
        else if (consumption <= 201){
            alert("Low consumption; Normal residential rate");
        }

        else if (consumption <= 301){
            alert("Average consumption; Typical electricy rate");
        }


         
        
        else if (consumption <= 501){
            alert("High consumption; Higher electricy rate");
        } 


        else{
             alert("Very High consumption; Heavy electricy rate");
        }
    }   
    </script>
</body>
</html>
